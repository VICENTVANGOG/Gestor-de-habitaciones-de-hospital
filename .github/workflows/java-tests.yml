name: Java CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode test
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick
      - name: Render desktop and mobile previews
        run: |
          mvn --batch-mode test-compile
          xvfb-run -a java -cp target/classes:target/test-classes hospital.UiPreview
          echo "DESKTOP_PREVIEW_BEGIN"
          convert target/ui-previews/dashboard-desktop.png -resize 480x320 -quality 28 jpg:- | base64 -w0
          echo
          echo "DESKTOP_PREVIEW_END"
          echo "PATIENTS_DESKTOP_BEGIN"
          convert target/ui-previews/patients-desktop.png -resize 480x320 -quality 28 jpg:- | base64 -w0
          echo
          echo "PATIENTS_DESKTOP_END"
          echo "ROOMS_DESKTOP_BEGIN"
          convert target/ui-previews/rooms-desktop.png -resize 480x320 -quality 28 jpg:- | base64 -w0
          echo
          echo "ROOMS_DESKTOP_END"
          echo "HISTORY_DESKTOP_BEGIN"
          convert target/ui-previews/history-desktop.png -resize 480x320 -quality 28 jpg:- | base64 -w0
          echo
          echo "HISTORY_DESKTOP_END"
          echo "MOBILE_PREVIEW_BEGIN"
          convert target/ui-previews/dashboard-mobile.png -resize 240x520 -quality 28 jpg:- | base64 -w0
          echo
          echo "MOBILE_PREVIEW_END"
          echo "PATIENTS_MOBILE_BEGIN"
          convert target/ui-previews/patients-mobile.png -resize 240x520 -quality 28 jpg:- | base64 -w0
          echo
          echo "PATIENTS_MOBILE_END"
          echo "ROOMS_MOBILE_BEGIN"
          convert target/ui-previews/rooms-mobile.png -resize 240x520 -quality 28 jpg:- | base64 -w0
          echo
          echo "ROOMS_MOBILE_END"
          echo "HISTORY_MOBILE_BEGIN"
          convert target/ui-previews/history-mobile.png -resize 240x520 -quality 28 jpg:- | base64 -w0
          echo
          echo "HISTORY_MOBILE_END"
          echo "TABLET_DASHBOARD_BEGIN"
          convert target/ui-previews/dashboard-tablet.png -resize 320x427 -quality 28 jpg:- | base64 -w0
          echo
          echo "TABLET_DASHBOARD_END"
          echo "TABLET_ROOMS_BEGIN"
          convert target/ui-previews/rooms-tablet.png -resize 320x427 -quality 28 jpg:- | base64 -w0
          echo
          echo "TABLET_ROOMS_END"
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: hospitalize-ui-previews
          path: target/ui-previews/*.png
